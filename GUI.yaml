# This file describes the visual layout and elements of a TUI that replicates the Syncthing web GUI. 
# This file was automatically generated by an agent parsing syncthing v2.0.13 source code

views:
  - name: Main
    # Primary view with tabs showing folders, this device, remote devices, and actions
    tabs:
      - name: Folders
        # List of synced folders with status indicators
        interactiveList:
          itemType: folder
          # Each folder item shows: label/id, status, path, sync percentage
        # Per-folder buttons shown when folder is expanded
        itemButtons: [Pause, Resume, Versions, Rescan, Edit]
        buttons: [Pause All, Resume All, Rescan All, Add Folder]

      - name: This Device
        # Shows local device information (not a list, just status display)
        statusDisplay:
          - Download Rate
          - Upload Rate
          - Local State (Total)
          - Listeners
          - Discovery
          - Uptime
          - Identification
          - Version

      - name: Remote Devices
        # List of connected/disconnected remote devices
        interactiveList:
          itemType: device
          # Each device item shows: name, status, sync percentage, connection type
        # Per-device buttons shown when device is expanded
        itemButtons: [Pause, Resume, Edit]
        buttons: [Pause All, Resume All, Recent Changes, Add Remote Device]

      - name: Actions
        # Menu of global actions
        select:
          - Settings
          - Advanced
          - Show ID
          - Logs
          - Support Bundle
          - Log Out
          - Restart
          - Shut Down

  - name: Edit Folder
    # Modal for creating or editing a folder configuration
    tabs:
      - name: General
        fields:
          - name: Folder Label
            type: text
            required: false
            description: Optional descriptive label for the folder. Can be different on each device.

          - name: Folder ID
            type: text
            required: true
            readonly: existing  # readonly when editing existing folder
            description: Required identifier for the folder. Must be the same on all cluster devices.

          - name: Folder Path
            type: text
            required: true
            readonly: existing  # readonly when editing existing folder
            description: Path to the folder on the local computer. Will be created if it does not exist.

      - name: Sharing
        # Checkbox list of devices to share the folder with: implement
        # do not implement
        # Encryption passwords per device, select all/deselect all

      - name: File Versioning
        fields:
          - name: File Versioning
            type: select
            options: [No File Versioning, Trash Can File Versioning, Simple File Versioning, Staggered File Versioning, External File Versioning]
            description: How to handle old versions of files.

          - name: Clean out after
            type: number
            suffix: days
            showWhen: [Trash Can, Simple]
            description: The number of days to keep files in the trash can. Zero means forever.

          - name: Keep Versions
            type: number
            showWhen: Simple
            description: The number of old versions to keep, per file.

          - name: Maximum Age
            type: number
            suffix: days
            showWhen: Staggered
            description: The maximum time to keep a version. Zero to keep versions forever.

          - name: Versions Path
            type: text
            showWhen: [Trash Can, Simple, Staggered]
            description: Path where versions should be stored. Leave empty for default .stversions directory.

          - name: Command
            type: text
            showWhen: External
            description: External command to handle versioning. Must remove the file from the shared folder.

          - name: Cleanup Interval
            type: number
            suffix: seconds
            showWhen: [Trash Can, Simple, Staggered]
            description: Interval for running cleanup in the versions directory. Zero to disable.

      - name: Ignore Patterns
        fields:
          - name: Patterns
            type: textarea
            description: Enter ignore patterns, one per line.

      - name: Advanced
        fields:
          - name: Watch for Changes
            type: checkbox
            description: Use notifications from the filesystem to detect changed items.

          - name: Full Rescan Interval
            type: number
            suffix: seconds
            description: How often to perform a full rescan of the folder.

          - name: Folder Type
            type: select
            options: [Send & Receive, Send Only, Receive Only, Receive Encrypted]
            description: How this folder syncs with other devices.

          - name: File Pull Order
            type: select
            options: [Random, Alphabetic, Smallest First, Largest First, Oldest First, Newest First]
            description: Order in which to download files.

          - name: Minimum Free Disk Space
            type: number
            suffix: select  # %, kB, MB, GB, TB
            description: Required free space on disk before syncing stops.

          - name: Ignore Permissions
            type: checkbox
            description: Disables comparing and syncing file permissions.

          # do not implement
          # Ownership section: Sync Ownership, Send Ownership
          # Extended Attributes section: Sync Extended Attrs, Send Extended Attrs, Filter rules

    buttons: [Pause, Rescan, Save, Close, Remove]

  - name: Edit Device
    # Modal for creating or editing a device configuration
    tabs:
      - name: General
        fields:
          - name: Device ID
            type: text
            required: true
            readonly: existing  # readonly when editing existing device
            description: The unique identifier for this device. Can be found in Actions > Show ID on the other device.

          - name: Device Name
            type: text
            required: false
            description: Shown instead of Device ID in the cluster status. Will be advertised to other devices.

      - name: Sharing
        fields:
          - name: Introducer
            type: checkbox
            description: Add devices from the introducer to our device list, for mutually shared folders.

          - name: Auto Accept
            type: checkbox
            description: Automatically create or share folders that this device advertises at the default path.

        # do not implement
        # Shared Folders list with encryption passwords
        # Unshared Folders list

      - name: Advanced
        fields:
          - name: Addresses
            type: text
            description: Comma separated addresses or "dynamic" for automatic discovery.

          - name: Compression
            type: select
            options: [All Data, Metadata Only, Off]
            description: What data to compress when syncing.

          - name: Number of Connections
            type: number
            description: Number of concurrent connections. Zero to let Syncthing decide.

          - name: Incoming Rate Limit
            type: number
            suffix: KiB/s
            description: Maximum incoming transfer rate. Zero for no limit.

          - name: Outgoing Rate Limit
            type: number
            suffix: KiB/s
            description: Maximum outgoing transfer rate. Zero for no limit.

          - name: Untrusted
            type: checkbox
            description: All folders shared with this device must be protected by a password.

    buttons: [Save, Close, Remove]

  - name: Settings
    # Global application settings modal
    tabs:
      - name: General
        fields:
          - name: Device Name
            type: text
            description: The name of this device shown to other devices.

          - name: Minimum Free Disk Space
            type: number
            suffix: select  # %, kB, MB, GB, TB
            description: Free space required on the home (index database) disk.

          - name: API Key
            type: text
            readonly: true
            description: Key for API access.
            button: Generate

          - name: Anonymous Usage Reporting
            type: select
            options: [Version 3, Version 2, Undecided, Disabled]
            description: Send anonymous usage statistics to help improve Syncthing.

          - name: Automatic Upgrades
            type: select
            options: [No Upgrades, Stable Releases Only, Stable Releases and Release Candidates]
            description: Automatically upgrade Syncthing when new versions are available.

        buttons: [Edit Folder Defaults, Edit Device Defaults]

      - name: GUI
        fields:
          - name: GUI Listen Address
            type: text
            description: Address and port for the GUI. Use non-privileged port 1024-65535.

          - name: GUI Authentication User
            type: text
            description: Username for GUI access.

          - name: GUI Authentication Password
            type: password
            description: Password for GUI access.

          - name: Use HTTPS for GUI
            type: checkbox
            description: Enable HTTPS for secure GUI access.

          - name: Start Browser
            type: checkbox
            description: Open browser automatically when Syncthing starts.

          - name: GUI Theme
            type: select
            options: [Default, Light, Dark, Black]
            description: Visual theme for the GUI.

      - name: Connections
        fields:
          - name: Sync Protocol Listen Addresses
            type: text
            description: Addresses for the sync protocol. Comma separated.

          - name: Incoming Rate Limit
            type: number
            suffix: KiB/s
            description: Global maximum incoming transfer rate. Zero for no limit.

          - name: Outgoing Rate Limit
            type: number
            suffix: KiB/s
            description: Global maximum outgoing transfer rate. Zero for no limit.

          - name: Limit Bandwidth in LAN
            type: checkbox
            description: Apply rate limits to LAN connections as well.

          - name: Enable NAT Traversal
            type: checkbox
            description: Attempt NAT traversal for incoming connections.

          - name: Local Discovery
            type: checkbox
            description: Discover devices on the local network.

          - name: Global Discovery
            type: checkbox
            description: Use global discovery servers to find devices.

          - name: Enable Relaying
            type: checkbox
            description: Allow connections through relay servers when direct connection fails.

          - name: Global Discovery Servers
            type: text
            description: Comma separated list of global discovery servers.

      - name: Ignored Devices
        # do not implement
        # Table of ignored devices with Unignore button

      - name: Ignored Folders
        # do not implement
        # Table of ignored folders with Unignore button

    buttons: [Save, Close]

  - name: Device Identification
    # Shows this device's ID for sharing with others
    fields:
      - name: Device ID
        type: text
        readonly: true
        monospace: true
        description: Share this ID with other devices to connect.

    # QR code display: implement (user request) — render with half-block chars

    buttons: [Copy, Share by Email, Share by SMS, Close]

  - name: About
    # Information about Syncthing
    tabs:
      - name: Authors
        # do not implement
        # List of contributors

      - name: Included Software
        # do not implement
        # List of included libraries

      - name: Paths
        statusDisplay:
          - User Home
          - Configuration Directory
          - Configuration File
          - Device Certificate
          - GUI / API HTTPS Certificate
          - Database Location
          - Log File
          - GUI Override Directory

    buttons: [Close]

  - name: Advanced Configuration
    # do not implement
    # Raw configuration editor with expandable sections for GUI, options, LDAP, folders, devices

  - name: Logs
    # do not implement
    # Log viewer with filtering

# Alerts appear as a stack of dismissable warning panels at the top of the main
# view in the web GUI, above the folder list. Each panel has a title, body text,
# and action buttons. Multiple alerts stack vertically; each pending device or
# pending folder offer gets its own panel.
#
# TUI analog (decided 2026-07-12): a fifth "Alerts" tab in the Main view that
# shows a badge with the alert count when non-empty, e.g. "Alerts(2)". Alerts
# never overlap other content. Each alert renders as a list item with the same
# body text and action buttons as the web GUI panels.
alerts:
  - name: New Device
    # Shown per pending device (REST: /rest/cluster/pending/devices,
    # event: PendingDevicesChanged)
    body: Device "{name}" ({deviceID} at {address}) wants to connect. Add new device?
    shows: [device name, device ID, address, time of request]
    buttons:
      - name: Add Device
        # Opens Edit Device modal prefilled with the device ID and name
      - name: Ignore
        # Permanently adds to ignore list, suppressing further notifications
      - name: Dismiss
        # Removes the alert without ignoring; notification may recur

  - name: New Folder / Share Folder
    # Shown per (pending folder x offering device)
    # (REST: /rest/cluster/pending/folders, event: PendingFoldersChanged)
    # Title is "New Folder" if folder is unknown locally, "Share Folder" if the
    # folder already exists and a new device offers to share it
    body: '{device} wants to share folder "{label}" ({folderID}). Add new folder? / Share this folder?'
    shows: [offering device name, folder label, folder ID, time of offer]
    buttons:
      - name: Add # when folder is new; opens Edit Folder modal prefilled, shared with offering device
      - name: Share # when folder already exists locally; shares it with the offering device
      - name: Ignore
        # Permanently adds to ignore list, suppressing further notifications
      - name: Dismiss
        # Removes the alert without ignoring; notification may recur

  - name: Restart Needed
    # Shown when config saved but not activated (configInSync == false)
    body: The configuration has been saved but not activated. Syncthing must restart to activate the new configuration.
    buttons: [Restart]

  - name: Notice
    # Shown when /rest/system/error returns errors; lists timestamped error messages
    body: List of error messages with timestamps
    buttons: [OK]  # clears the error list

  - name: GUI Authentication Warning
    # Shown when GUI allows remote access without a password
    body: The Syncthing admin interface is configured to allow remote access without a password.
    buttons: [Settings]  # opens Settings modal
